<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b5e20">
<title>Bag Bio — Operarios</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f0;min-height:100vh;color:#222;}
.hdr{background:#1b5e20;color:white;padding:16px 18px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
.hdr-logo{height:34px;display:flex;align-items:center;background:white;border-radius:8px;padding:2px 8px;}
.hdr-logo img{height:30px;width:auto;object-fit:contain;}
.hdr-txt h1{font-size:16px;font-weight:700;}
.hdr-txt p{font-size:11px;opacity:.8;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;margin-left:auto;box-shadow:0 0 0 2px rgba(255,255,255,.3);}
.sync-dot.off{background:#f44336;}
.sync-dot.spin{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* SCREENS */
.screen{display:none;padding:16px;max-width:480px;margin:0 auto;}
.screen.active{display:block;}

/* HOME */
.home-title{text-align:center;padding:20px 0 8px;font-size:13px;color:#555;font-weight:600;letter-spacing:.5px;}
.btn-main{display:flex;align-items:center;gap:16px;background:white;border:none;border-radius:16px;padding:20px 18px;width:100%;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .1s,box-shadow .1s;}
.btn-main:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.btn-main .ico{font-size:32px;min-width:40px;text-align:center;}
.btn-main .txt{text-align:left;}
.btn-main .txt strong{display:block;font-size:16px;color:#222;}
.btn-main .txt span{font-size:12px;color:#777;margin-top:2px;display:block;}
.btn-gasto{border-left:5px solid #2e7d32;}
.btn-falla{border-left:5px solid #c62828;}
.btn-ver{border-left:5px solid #1565c0;}

/* FORMS */
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#1b5e20;font-size:14px;font-weight:600;cursor:pointer;padding:4px 0 16px;}
.form-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#1b5e20;}
.form-title.red{color:#c62828;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;background:white;color:#222;-webkit-appearance:none;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1b5e20;}
.field textarea{resize:none;min-height:80px;}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:10px;color:#999;pointer-events:none;}
.field-foto{border:2px dashed #ccc;border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:#fafafa;position:relative;}
.field-foto input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.field-foto .ico{font-size:28px;}
.field-foto p{font-size:12px;color:#888;margin-top:4px;}
.field-foto.has-foto{border-color:#1b5e20;background:#e8f5e9;}
.btn-submit{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-submit.green{background:#1b5e20;color:white;}
.btn-submit.red{background:#c62828;color:white;}
.btn-submit:active{opacity:.85;}

/* LISTA GASTOS */
.gasto-card{background:white;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:center;}
.gasto-card .info strong{font-size:14px;color:#222;}
.gasto-card .info span{font-size:12px;color:#888;display:block;margin-top:2px;}
.gasto-card .monto{font-size:16px;font-weight:800;color:#1b5e20;}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:14px;}
.total-bar{background:#1b5e20;color:white;border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 22px;border-radius:30px;font-size:13px;opacity:0;transition:opacity .3s;z-index:100;white-space:nowrap;}
.toast.on{opacity:1;}
</style>
</head>

<div class="screen" id="sc-gasto">

  <div class="field">
    <label>Cliente / Servicio</label>
    <div class="sel-wrap">
      <select id="g-cliente">
        <option value="">Cargando servicios...</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Tipo de gasto</label>
    <div class="sel-wrap">
      <select id="g-tipo">
        <option value="Combustible">⛽ Combustible</option>
        <option value="Comida">🍽️ Comida</option>
        <option value="Hotel">🏨 Hotel</option>
        <option value="Peaje">🛣️ Peaje</option>
        <option value="Carga virtual">📱 Carga virtual</option>
        <option value="Repuesto">🔩 Repuesto / Insumo</option>
        <option value="Otros">📦 Otros</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Monto ($)</label>
    <input type="number" id="g-monto" placeholder="0" inputmode="numeric" min="0">
  </div>

  <div class="field">

    <input type="text" id="g-obs" placeholder="Ej: gasoil YPF, almuerzo los dos...">
  </div>

  <div class="field">
    <label>Foto del comprobante (opcional)</label>

      <p id="foto-lbl">Tocar para sacar foto o elegir imagen</p>
    </div>
  </div>

  <button class="btn-submit green" onclick="guardarGasto()">✅ REGISTRAR GASTO</button>
</div>

  <div class="field">
    <label>Cliente / Servicio</label>
    <div class="sel-wrap">
      <select id="f-cliente-falla">
        <option value="">Cargando servicios...</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Máquina</label>
    <div class="sel-wrap">
      <select id="f-maquina">
        <option value="Selladora N°1">Selladora N°1</option>
        <option value="Selladora N°2">Selladora N°2</option>
        <option value="Compresor">Compresor</option>
        <option value="Generador">Generador</option>
        <option value="Otra">Otra</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>¿Qué pasó? Describí el problema</label>
    <textarea id="f-desc" placeholder="Ej: la selladora no cierra bien, hace ruido raro al arrancar, perdió presión..."></textarea>
  </div>

  <div class="field">
    <label>¿Pudieron continuar el servicio?</label>
    <div class="sel-wrap">
      <select id="f-continuo">
        <option value="Sí">✅ Sí, continuamos normalmente</option>
        <option value="Parcial">⚠️ Sí, pero con dificultades</option>
        <option value="No">❌ No, tuvimos que parar</option>
      </select>
    </div>
  </div>

  <button class="btn-submit red" onclick="enviarFalla()">📲 ENVIAR REPORTE A SERGIO</button>
</div>

<!-- VER GASTOS -->
<div class="screen" id="sc-ver">
  <button class="back-btn" onclick="goTo('sc-home')">← Volver</button>
  <div class="form-title">📋 Mis gastos registrados</div>
  <div id="ver-content"><div class="empty">Sincronizando...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://tmoosnpofmzwxditshdh.supabase.co';
var SB_KEY='sb_publishable_fRQ_8Ekzfyau6367zg3sew_pcruuFze';
var WA_SERGIO='5493516457149';
var servicios=[];

function sbH(){return{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};}
async function sbGet(t,p){try{var r=await fetch(SB_URL+'/rest/v1/'+t+'?'+(p||'select=*'),{headers:sbH()});return await r.json();}catch(e){return null;}}
async function sbInsert(t,d){try{var r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:Object.assign({},sbH(),{'Prefer':'return=minimal'}),body:JSON.stringify(d)});return r.ok;}catch(e){return false;}}

function n(id){return document.getElementById(id);}
function fNum(x){return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function fDate(d){if(!d)return'';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function toast(msg,dur){var t=n('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},dur||2600);}

function goTo(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  n(id).classList.add('active');
  window.scrollTo(0,0);
}

function populateSelects(svcs){
  var activos=svcs.filter(function(s){return s.estado==='Confirmado'||s.estado==='En curso'||s.estado==='Pendiente';});
  var opts=activos.length?activos.map(function(s){
    return '<option value="'+s.id+'">'+s.cliente+' — '+fDate(s.fecha)+'</option>';
  }).join(''):'<option value="">Sin servicios activos</option>';
  n('g-cliente').innerHTML=opts;
  n('f-cliente-falla').innerHTML=opts;
}

// Sync servicios
async function sync(){
  n('syncDot').className='sync-dot spin';
  var svcs=await sbGet('servicios','select=id,cliente,fecha,estado&order=fecha.desc&limit=30');
  if(Array.isArray(svcs)&&svcs.length){
    servicios=svcs;
    populateSelects(svcs);
    n('syncDot').className='sync-dot';
  }else{
    n('syncDot').className='sync-dot off';
  }
}

// Foto
function onFoto(input){
  if(input.files&&input.files[0]){
    n('foto-lbl').textContent='✅ '+input.files[0].name;
    n('foto-wrap').classList.add('has-foto');
  }
}

// Guardar gasto
async function guardarGasto(){
  var svcId=n('g-cliente').value;
  var svcOpt=n('g-cliente').options[n('g-cliente').selectedIndex];
  var tipo=n('g-tipo').value;
  var monto=parseFloat(n('g-monto').value)||0;
  var obs=n('g-obs').value.trim();
  if(!svcId){toast('⚠️ Seleccioná un servicio');return;}
  if(!monto){toast('⚠️ Ingresá el monto');return;}
  var btn=document.querySelector('#sc-gasto .btn-submit');
  btn.textContent='Guardando...';btn.disabled=true;
  var ok=await sbInsert('gastos',{
    servicio_id:svcId,
    tipo:tipo,
    monto:monto,
    obs:obs||tipo,
    proveedor:'',
    nro_comprobante:'',
    tipo_comprobante:''
  });
  btn.textContent='✅ REGISTRAR GASTO';btn.disabled=false;
  if(ok){
    toast('✅ Gasto registrado — $'+fNum(monto));
    n('g-monto').value='';
    n('g-obs').value='';
    n('g-foto').value='';
    n('foto-lbl').textContent='Tocar para sacar foto o elegir imagen';
    n('foto-wrap').classList.remove('has-foto');
    goTo('sc-home');
  }else{
    toast('⚠️ Error al guardar. Intentá de nuevo.');
  }
}

// Enviar falla a Sergio
function enviarFalla(){
  var svcOpt=n('f-cliente-falla').options[n('f-cliente-falla').selectedIndex];
  var cliente=svcOpt?svcOpt.text:'—';
  var maquina=n('f-maquina').value;
  var desc=n('f-desc').value.trim();
  var continuo=n('f-continuo').value;
  var fecha=new Date().toLocaleDateString('es-AR');
  if(!desc){toast('⚠️ Describí el problema');return;}
  var msg='🔧 *REPORTE DE FALLA — BAG BIO*\n\n'
    +'📅 Fecha: '+fecha+'\n'
    +'👤 Cliente: '+cliente+'\n'
    +'⚙️ Máquina: '+maquina+'\n'
    +'❌ Problema: '+desc+'\n'
    +'✅ ¿Continuaron? '+continuo+'\n\n'
    +'_(Reporte enviado desde app de campo)_';
  window.open('whatsapp://send?phone='+WA_SERGIO+'&text='+encodeURIComponent(msg),'_blank');
  toast('📲 Abriendo WhatsApp con Sergio...');
  n('f-desc').value='';
  setTimeout(function(){goTo('sc-home');},1500);
}

// Ver gastos
async function renderGastos(){
  n('ver-content').innerHTML='<div class="empty">Cargando...</div>';
  var rows=await sbGet('gastos','select=id,servicio_id,tipo,monto,obs,created_at&order=created_at.desc&limit=50');
  if(!Array.isArray(rows)||rows.length===0){
    n('ver-content').innerHTML='<div class="empty">📭 No hay gastos registrados aún.</div>';
    return;
  }
  // Agrupar por servicio
  var bySvc={};
  rows.forEach(function(g){
    var sid=g.servicio_id||'—';
    if(!bySvc[sid])bySvc[sid]=[];
    bySvc[sid].push(g);
  });
  var html='';
  Object.keys(bySvc).forEach(function(sid){
    var gs=bySvc[sid];
    var total=gs.reduce(function(a,g){return a+(parseFloat(g.monto)||0);},0);
    var svc=servicios.find(function(s){return s.id===sid;});
    var lbl=svc?(svc.cliente+' — '+fDate(svc.fecha)):sid;
    html+='<div class="total-bar"><span>'+lbl+'</span><span>$'+fNum(total)+'</span></div>';
    gs.forEach(function(g){
      var dt=g.created_at?new Date(g.created_at).toLocaleDateString('es-AR'):'—';
      html+='<div class="gasto-card"><div class="info"><strong>'+g.tipo+'</strong><span>'+(g.obs||'')+(g.obs?' · ':'')+dt+'</span></div><div class="monto">$'+fNum(g.monto||0)+'</div></div>';
    });
    html+='<div style="height:10px"></div>';
  });
  n('ver-content').innerHTML=html;
}

sync();
</script>
</body>
</html>
